[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: Adaptive Streaming Time-Series Anomaly Detection System (Utkrishta 2026 Challenge 2)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Satya Boli", email = "satyaritik11@gmail.com"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.2.0"
]
dashboard = [
    "streamlit>=1.35.0",
    "altair>=5.3.0",
    "matplotlib>=3.8.0"
]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
